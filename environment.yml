# =============================================================================
# environment.yml
# Seagrass Health Predictive Pipeline — Conda Environment
#
# Recommended for users working with geospatial libraries (rasterio, GDAL),
# which can be difficult to install via pip due to binary dependencies.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate seagrass_pipeline
#
# Python version: 3.10 (stable; 3.12 not yet supported by all geo packages)
# =============================================================================

name: seagrass_pipeline

channels:
  - conda-forge     # Primary channel: best geospatial package support
  - defaults

dependencies:
  - python=3.10
  - pip

  # --- Core scientific stack ---
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13.1

  # --- Geospatial (conda-forge has pre-compiled GDAL binaries) ---
  - rasterio=1.3.10
  - geopandas=0.14.4
  - shapely=2.0.4
  - pyproj=3.6.1
  - rasterstats=0.19.0
  - fiona=1.9.6
  - gdal

  # --- Machine learning ---
  - scikit-learn=1.5.0
  - xgboost=2.0.3
  - imbalanced-learn=0.12.3

  # --- Visualisation ---
  - matplotlib=3.9.0
  - seaborn=0.13.2

  # --- Data storage ---
  - pyarrow=16.1.0

  # --- Configuration ---
  - pyyaml=6.0.1

  # --- Data acquisition (scripts/download_dbhydro_wq.py) ---
  - requests=2.32.3
  - lxml=5.2.2

  # --- Notebooks ---
  - jupyter
  - ipykernel

  # --- Testing ---
  - pytest=8.2.2
  - pytest-cov=5.0.0

  # --- Utilities ---
  - tqdm=4.66.4
  - joblib=1.4.2

  # --- pip-only packages ---
  - pip:
    - shap==0.45.1
